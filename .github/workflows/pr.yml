name: PR

on:
  pull_request:
    branches:
      - main

env:
  CI: true

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci

      - name: lint
        uses: reviewdog/action-eslint@v1
        with:
          reporter: github-check
          eslint_flags: 'src/'

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit-Tests
        run: npm run test-coverage

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Vitest Tests
          path: junit.xml
          reporter: java-junit

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
